name: Forecast CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: PHP syntax check
        run: |
          find woo-sales-dashboard -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check woo-sales-dashboard/assets/js/dashboard.js

      - name: Run PHP tests
        run: |
          set -e
          for test in woo-sales-dashboard/tests/*.php; do
            echo "==> $test"
            php "$test"
          done
